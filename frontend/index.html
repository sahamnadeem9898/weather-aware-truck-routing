<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the saved or system theme before first paint, so there is no flash.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('stormline-theme')
        } catch (e) {}
        var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : system
      })()
    </script>
    <meta
      name="description"
      content="Weather-aware truck routing: three routes scored by wind, rain, snow and load at the hour the truck arrives."
    />
    <title>Stormline · Weather-aware truck routing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
